[project]
name = "local-ai"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Sauhard74", email = "sauhard74best@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "fastapi>=0.150.0",
    "httpx>=0.28.1",
    "huggingface-hub[cli]>=2.2.0",
    "jinja2>=3.1.6",
    "mlx>=0.32.4",
    "mlx-lm>=0.32.2",
    "mlx-vlm>=0.7.9",
    "numpy>=2.5.4",
    "psutil>=7.2.2",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.3",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
local-ai = "local_ai:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest skips dirs named "build" by default, which hid tests/build
norecursedirs = [".*", ".venv", "artifacts", "models", "logs", "__pycache__"]
